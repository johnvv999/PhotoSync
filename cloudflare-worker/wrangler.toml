name = "photosync-gemini-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"

# Where photo descriptions are remembered, so each photo is described once for
# everyone instead of once per visitor. Created with:
#
#   wrangler kv namespace create DESCRIPTIONS
#
# The id is not a secret — it names the namespace, and reaching it still needs
# account credentials.
[[kv_namespaces]]
binding = "DESCRIPTIONS"
id = "66a4d8ea45354057bcb40b156ed26ff3"
