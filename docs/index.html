<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PhotoSync</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #6b6b70;
    --header-bg: #f2f2f4;
    --border: #e5e5e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --fg: #f2f2f3;
      --muted: #a0a0a5;
      --header-bg: #1e1e21;
      --border: #2c2c2f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding-bottom: 48px;
  }
  .app-title {
    padding: 24px 20px 16px;
    font-size: 28px;
    font-weight: 700;
  }
  .status {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 16px;
  }
  .city-header {
    position: sticky;
    top: 0;
    background: var(--header-bg);
    padding: 14px 20px;
    font-size: 19px;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
    z-index: 1;
  }
  .photo-card { padding: 0 0 20px; }
  .photo-card img {
    width: 100%;
    display: block;
    background: var(--header-bg);
    min-height: 200px;
  }
  .link-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 20px 0;
  }
  /* Sits between the Info and Map buttons. flex:1 with min-width:0 lets it take
     the space between them and ellipsis a long filename, rather than growing the
     row and pushing Map off the edge. */
  .photo-name {
    flex: 1;
    min-width: 0;
    padding: 0 12px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .info-link, .map-link {
    font-size: 15px;
    font-weight: 700;
    color: #1a73e8;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }
  .map-link[disabled] {
    color: var(--muted);
    cursor: default;
  }
  .map-link.retry {
    color: #c77700;
  }
  .info-result {
    display: none;
    padding: 4px 20px 0;
    font-size: 14px;
    color: var(--fg);
  }
  .info-result.visible { display: block; }
  .map-embed {
    display: none;
    width: 100%;
    height: 260px;
    border: 0;
    margin-top: 8px;
  }
  .map-embed.visible { display: block; }
</style>
</head>
<body>
<main>
  <div class="app-title">PhotoSync</div>
  <div id="content" class="status">Loading photos…</div>
</main>

<script>
  // --- Configuration ---
  // Restricted Drive API key: Google Cloud Console → APIs & Services → Credentials
  // → Create Credentials → API key. Restrict it to the Google Drive API only, and
  // to this page's HTTP referrer (e.g. "https://<username>.github.io/*"), so a
  // leaked key can only ever list/read files that are already publicly shared.
  const DRIVE_API_KEY = "AIzaSyC8O4kNQlCV0br64HsWZJmm9MnhxD-wPQ8";
  // Must match the folder the Android app is syncing into. The app can be
  // repointed at any time via Settings -> Use Shared Folder, and this constant
  // does not follow it — when the two drift apart the page silently displays a
  // folder nothing is writing to any more, which looks exactly like stale
  // caching. The app's current value lives in its root_folder_id preference.
  // Previous folder, kept as a reference: 1dg9otHHfIUfgUKzSZrTY8OALakA7n_ua
  const FOLDER_ID = "1FI2DP8Un2DBqhSx2cl_DVc9dDhBgpOMA";

  // Gemini calls go through a small Cloudflare Worker proxy (see
  // /cloudflare-worker) instead of hitting the Gemini API directly — the real
  // key lives server-side as a Worker secret, never in this public HTML. A
  // key hardcoded here previously got auto-detected and revoked by Google's
  // leaked-key scanning within hours of being committed.
  const GEMINI_PROXY_URL = "https://photosync-gemini-proxy.johnvv999.workers.dev";

  const contentEl = document.getElementById("content");
  const infoCache = new Map();
  const gpsCache = new Map();
  /** fileId -> the in-flight GPS read, so two callers share one download. */
  const gpsInFlight = new Map();

  /**
   * Runs a card's deferred work when it comes near the viewport.
   *
   * Deciding whether a photo's Map link lights up means downloading part of it
   * and parsing the EXIF, and doing that for the whole folder on load is a
   * hundred downloads and a hundred parses for photos nobody has scrolled to.
   * That work is what kept the page from painting an answer it already had.
   *
   * A screen's worth of margin means the answer is normally ready before the
   * card is actually looked at.
   */
  const nearViewport = new IntersectionObserver(
    (entries, observer) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        observer.unobserve(entry.target);
        const run = entry.target.whenNear;
        if (run) run();
      }
    },
    { rootMargin: "600px" }
  );

  /** Parses "Country_City" from this app's own upload naming convention, or null if it doesn't match. */
  // Tokens the uploader writes when it couldn't work out where a photo was
  // taken. "Unsorted_NoGPS_001.jpg" is not a photo from a place called NoGPS,
  // Unsorted — treating it as one grouped every unlocated photo under a heading
  // that looked like a real city.
  const PLACEHOLDER_PLACES = new Set(["NoGPS", "Unsorted", "Unknown"]);

  function cityLabelFromName(name) {
    const base = name.replace(/\.[^/.]+$/, "");
    const parts = base.split("_");
    if (parts.length < 3) return null;
    const [country, city] = parts;
    // Returning null rather than a label matters: it lets resolveCityLabel fall
    // through to reading the photo's own GPS, which may well place a photo the
    // filename couldn't.
    if (PLACEHOLDER_PLACES.has(country) || PLACEHOLDER_PLACES.has(city)) return null;
    return `${city}, ${country}`;
  }

  // OpenStreetMap Nominatim's usage policy caps requests at ~1/second and asks
  // that clients not hammer it — this throttle enforces that spacing globally
  // across all reverse-geocode calls on the page.
  let lastNominatimCallAt = 0;
  async function reverseGeocode(lat, lon) {
    const waitMs = Math.max(0, 1000 - (Date.now() - lastNominatimCallAt));
    if (waitMs > 0) await new Promise((resolve) => setTimeout(resolve, waitMs));
    lastNominatimCallAt = Date.now();

    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=10`;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    let data;
    try {
      const res = await fetch(url, { signal: controller.signal });
      if (!res.ok) throw new Error(`Nominatim request failed (HTTP ${res.status})`);
      data = await res.json();
    } finally {
      clearTimeout(timeoutId);
    }
    const addr = data.address || {};
    const city = addr.city || addr.town || addr.village || addr.municipality || addr.county;
    const country = addr.country;
    if (city && country) return `${city}, ${country}`;
    return country || null;
  }

  /** City label for a photo: filename convention first, falling back to GPS EXIF + reverse geocoding. */
  async function resolveCityLabel(file) {
    const fromName = cityLabelFromName(file.name);
    if (fromName) return fromName;

    const gpsResult = await getGpsForPhoto(file.id);
    if (!gpsResult.ok || !gpsResult.coords) return "Other Photos";

    try {
      const place = await reverseGeocode(gpsResult.coords.lat, gpsResult.coords.lon);
      return place || "Other Photos";
    } catch (e) {
      return "Other Photos";
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function fetchImageAsBase64(fileId) {
    // Google's user-content CDN is CORS-friendly and auto-orients the image;
    // the Drive API's ?alt=media download no longer allows browser fetch (CORS).
    // =w1600 is plenty of detail for Gemini and far smaller than the original.
    const url = `https://lh3.googleusercontent.com/d/${fileId}=w1600`;
    return fetch(url)
      .then((res) => {
        if (!res.ok) throw new Error(`Drive download failed (HTTP ${res.status})`);
        return res.blob();
      })
      .then(
        (blob) =>
          new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result.split(",")[1]);
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(blob);
          })
      );
  }

  // Every photo card asks for its GPS as it renders, and each answer costs a
  // download of the full original. Left unbounded that is a hundred multi-
  // megabyte requests fired at once, which exhausts the browser's connection
  // pool: anything else the page needs — notably the small "is this photo
  // already described" lookup behind Info — then waits ten seconds behind
  // them, looking for all the world like it went off to the AI.
  //
  // Four at a time keeps the pipe busy without owning it. The rest wait here,
  // in our queue, instead of in the browser's.
  const MAX_CONCURRENT_ORIGINALS = 4;
  let activeOriginalFetches = 0;
  const originalFetchQueue = [];

  function withDownloadSlot(task) {
    return new Promise((resolve, reject) => {
      const run = () => {
        activeOriginalFetches++;
        task().then(resolve, reject).finally(() => {
          activeOriginalFetches--;
          const next = originalFetchQueue.shift();
          if (next) next();
        });
      };
      if (activeOriginalFetches < MAX_CONCURRENT_ORIGINALS) run();
      else originalFetchQueue.push(run);
    });
  }

  // EXIF lives in the JPEG's first segment, so the head of the file is all
  // that's needed — 128KB against originals of around 3MB. Verified against
  // the full download on a sample of this folder: identical coordinates every
  // time, at a twentieth of the bytes.
  const EXIF_PREFIX_BYTES = 131072;

  /**
   * Whether the CDN honours a ranged request. It does today, but a fetch that
   * simply fails would leave every Map link broken, so the first refusal
   * switches the page back to whole-file downloads for good.
   */
  let rangeRequestsWork = true;

  // Downloads the start of the original file (=d) from Google's CORS-friendly
  // user-content CDN to read its EXIF GPS tag. The Drive API's ?alt=media
  // download no longer permits browser fetch (CORS), and the CDN's resized
  // variants strip EXIF, so the original is what has to be read. Capped at 10s
  // so a slow request can't hang the whole page's location resolution.
  function fetchImagePrefix(fileId) {
    return withDownloadSlot(async () => {
      const url = `https://lh3.googleusercontent.com/d/${fileId}=d`;

      async function download(useRange) {
        const controller = new AbortController();
        // The timeout starts when the request does, not when it was queued —
        // otherwise everything behind a full queue would time out having never
        // been sent.
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        try {
          const options = { signal: controller.signal };
          if (useRange) options.headers = { Range: `bytes=0-${EXIF_PREFIX_BYTES - 1}` };
          const res = await fetch(url, options);
          if (!res.ok) throw new Error(`Image download failed (HTTP ${res.status})`);
          return await res.arrayBuffer();
        } finally {
          clearTimeout(timeoutId);
        }
      }

      if (!rangeRequestsWork) return download(false);
      try {
        return await download(true);
      } catch (e) {
        rangeRequestsWork = false;
        return download(false);
      }
    });
  }

  /** Reads GPS coordinates from a JPEG's EXIF data, or null if none present. */
  function readExifGps(buffer) {
    const view = new DataView(buffer);
    if (view.byteLength < 4 || view.getUint16(0) !== 0xffd8) return null;

    let offset = 2;
    while (offset + 4 <= view.byteLength) {
      if (view.getUint8(offset) !== 0xff) break;
      const marker = view.getUint8(offset + 1);
      if (marker === 0xd8 || marker === 0x01 || (marker >= 0xd0 && marker <= 0xd7)) {
        offset += 2;
        continue;
      }
      if (marker === 0xd9 || marker === 0xda) break;
      const size = view.getUint16(offset + 2);
      if (marker === 0xe1 && offset + 10 <= view.byteLength) {
        const segStart = offset + 4;
        const isExif =
          view.getUint8(segStart) === 0x45 && view.getUint8(segStart + 1) === 0x78 &&
          view.getUint8(segStart + 2) === 0x69 && view.getUint8(segStart + 3) === 0x66 &&
          view.getUint8(segStart + 4) === 0x00 && view.getUint8(segStart + 5) === 0x00;
        if (isExif) {
          try { return parseExifGps(view, segStart + 6); } catch (e) { return null; }
        }
      }
      offset += 2 + size;
    }
    return null;
  }

  function parseExifGps(view, tiffStart) {
    const little = view.getUint16(tiffStart, false) === 0x4949;
    const u16 = (o) => view.getUint16(o, little);
    const u32 = (o) => view.getUint32(o, little);

    const ifd0Offset = u32(tiffStart + 4);
    let gpsIfdOffset = null;
    const ifd0Count = u16(tiffStart + ifd0Offset);
    for (let i = 0; i < ifd0Count; i++) {
      const entryOffset = tiffStart + ifd0Offset + 2 + i * 12;
      if (u16(entryOffset) === 0x8825) {
        gpsIfdOffset = u32(entryOffset + 8);
        break;
      }
    }
    if (gpsIfdOffset == null) return null;

    const gpsStart = tiffStart + gpsIfdOffset;
    const gpsCount = u16(gpsStart);
    // A real GPS IFD has well under 20 entries — a much larger count means the
    // offset landed somewhere wrong (e.g. truncated/misaligned data), so bail
    // out rather than looping through garbage bytes that might coincidentally
    // look like valid tags.
    if (gpsCount > 32) return null;
    let lat = null, latRef = null, lon = null, lonRef = null;

    const readDms = (valueOffset) => {
      let total = 0;
      for (let j = 0; j < 3; j++) {
        const num = u32(valueOffset + j * 8);
        const den = u32(valueOffset + j * 8 + 4);
        const value = den === 0 ? 0 : num / den;
        total += j === 0 ? value : value / Math.pow(60, j);
      }
      return total;
    };

    for (let i = 0; i < gpsCount; i++) {
      const entryOffset = gpsStart + 2 + i * 12;
      const tag = u16(entryOffset);
      const valueOffset = tiffStart + u32(entryOffset + 8);
      if (tag === 0x0001) latRef = String.fromCharCode(view.getUint8(entryOffset + 8));
      else if (tag === 0x0002) lat = readDms(valueOffset);
      else if (tag === 0x0003) lonRef = String.fromCharCode(view.getUint8(entryOffset + 8));
      else if (tag === 0x0004) lon = readDms(valueOffset);
    }

    if (lat == null || lon == null) return null;
    // (0, 0) — "Null Island", open ocean off West Africa — is the standard
    // signature of a parsing failure or an unset GPS field, not a real photo
    // location. Real EXIF tooling conventionally rejects it rather than
    // reporting a bogus location.
    if (lat === 0 && lon === 0) return null;
    return { lat: latRef === "S" ? -lat : lat, lon: lonRef === "W" ? -lon : lon };
  }

  // Distinguishes "checked, no GPS tag present" from "couldn't check" (network/rate-limit
  // failure) — treating those the same would make a temporary glitch look identical to a
  // photo that genuinely has no location, with no way to tell the two apart or retry.
  async function getGpsForPhoto(fileId) {
    if (gpsCache.has(fileId)) return gpsCache.get(fileId);

    // The city headings and the card's own Map link both want this, and they
    // ask at much the same moment. The cache is only written once an answer
    // arrives, so without sharing the request in flight the same photo gets
    // downloaded twice.
    const pending = gpsInFlight.get(fileId);
    if (pending) return pending;

    const attempt = (async () => {
      let result;
      try {
        const buffer = await fetchImagePrefix(fileId);
        result = { ok: true, coords: readExifGps(buffer) };
      } catch (e) {
        result = { ok: false };
      }
      if (result.ok) gpsCache.set(fileId, result);
      gpsInFlight.delete(fileId);
      return result;
    })();

    gpsInFlight.set(fileId, attempt);
    return attempt;
  }

  function proxyPost(payload) {
    return fetch(GEMINI_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  }

  /**
   * Asks the proxy whether this photo already has a description, without
   * sending the photo.
   *
   * Worth its own round trip: describing a photo means downloading it at
   * 1600px and posting it back as base64, several megabytes over whatever
   * connection the visitor is on. Once anyone has described a photo, nobody
   * else should pay that again.
   */
  async function lookupDescription(file) {
    try {
      const res = await proxyPost({ mode: "lookup", photoId: file.id, version: file.md5Checksum });
      if (!res.ok) return null;
      const data = await res.json();
      return data.text || null;
    } catch (e) {
      // A lookup that fails just means doing it the long way.
      return null;
    }
  }

  async function describePhoto(file) {
    if (!GEMINI_PROXY_URL || GEMINI_PROXY_URL === "YOUR_WORKER_URL_HERE") {
      return "Info isn't configured for this page yet.";
    }
    try {
      const base64Image = await fetchImageAsBase64(file.id);
      const payload = {
        mimeType: file.mimeType || "image/jpeg",
        data: base64Image,
        // Named so the proxy can remember the answer for the next visitor. The
        // checksum ties it to this photo's content, so replacing the photo
        // retires the old description rather than outliving it.
        photoId: file.id,
        version: file.md5Checksum,
      };
      // Include GPS (if we've resolved it) so Gemini can pin the actual location.
      const gps = await getGpsForPhoto(file.id);
      if (gps.ok && gps.coords) {
        payload.lat = gps.coords.lat;
        payload.lon = gps.coords.lon;
      }
      const res = await proxyPost(payload);
      const data = await res.json();
      if (!res.ok) {
        return data.error || `Request failed (${res.status})`;
      }
      return data.text || "No description returned.";
    } catch (e) {
      return `Couldn't get info: ${e.message}`;
    }
  }

  async function loadPhotos() {
    if (!DRIVE_API_KEY || DRIVE_API_KEY === "YOUR_DRIVE_API_KEY_HERE") {
      contentEl.textContent = "This page isn't configured yet — missing Drive API key.";
      return;
    }

    function listingUrl(pageToken) {
      const url = new URL("https://www.googleapis.com/drive/v3/files");
      url.searchParams.set("q", `'${FOLDER_ID}' in parents and trashed=false and mimeType contains 'image/'`);
      // `description` carries the AI text the app already worked out for a photo,
      // and it arrives with the listing at no extra cost — so Info can show it
      // without a Gemini round trip, and without every visitor paying to be told
      // the same thing. `md5Checksum` keys the proxy's cache of descriptions this
      // page generated itself: it changes only if the image content does, so a
      // rename (which PhotoSync does routinely) doesn't discard the text.
      url.searchParams.set("fields", "nextPageToken,files(id,name,description,createdTime,parents,mimeType,trashed,md5Checksum)");
      url.searchParams.set("key", DRIVE_API_KEY);
      url.searchParams.set("orderBy", "createdTime");
      // Drive hands back 100 files unless told otherwise, and quietly offers the
      // rest behind a token. Asked for one page and never following it, this
      // page simply stopped at the hundredth photo — with no gap, no error, and
      // nothing to suggest the folder went on.
      url.searchParams.set("pageSize", "1000");
      if (pageToken) url.searchParams.set("pageToken", pageToken);
      return url;
    }

    let files = [];
    try {
      let pageToken = null;
      // Bounded so a token that never clears can't spin forever: a thousand a
      // page, so this covers a library far larger than the folder is likely to
      // hold, and stops rather than hanging if it doesn't.
      for (let page = 0; page < 50; page++) {
        const res = await fetch(listingUrl(pageToken));
        if (!res.ok) {
          contentEl.textContent = `Couldn't load photos (HTTP ${res.status}). The folder may not be shared publicly yet.`;
          return;
        }
        const data = await res.json();
        files = files.concat(
          (data.files || []).filter(
            (f) => f.trashed !== true &&
                   f.mimeType && f.mimeType.startsWith("image/") &&
                   (f.parents || []).includes(FOLDER_ID)
          )
        );
        pageToken = data.nextPageToken || null;
        if (!pageToken) break;
      }
    } catch (e) {
      contentEl.textContent = "Couldn't reach Google Drive. Check your connection.";
      return;
    }

    if (files.length === 0) {
      contentEl.textContent = "No photos yet.";
      return;
    }

    // Strictly chronological — date, then time within the day.
    //
    // Places group themselves as a consequence, because a day's travel is
    // sequential: every Passau photo precedes every Schärding photo when that
    // is the order they were taken. Sorting by country and city inside the day
    // instead would put Austria before Germany and reverse the trip.
    //
    // Name is the tiebreak only for photos sharing an identical timestamp, so
    // the ordering is stable rather than left to the API's response order.
    files.sort((a, b) => {
      const ta = new Date(a.createdTime).getTime() || 0;
      const tb = new Date(b.createdTime).getTime() || 0;
      return ta - tb || a.name.localeCompare(b.name);
    });

    contentEl.textContent = "Resolving photo locations…";
    const resolvedLabels = [];
    for (const file of files) {
      resolvedLabels.push(await resolveCityLabel(file));
    }

    // Collapse repeat visits within a day.
    //
    // A day's travel often returns to where it started — out from Passau into
    // Austria and back — which chronologically produces the same heading twice.
    // Photos for one place on one day are gathered under a single heading,
    // placed where that day's first photo of it falls, so the day still reads
    // in the order it happened: all of Passau, then Schärding.
    //
    // Grouping is per day, not across the trip: merging every Passau photo from
    // every day would collapse the journey itself. The day is taken in UTC so
    // the grouping is identical for every viewer, rather than shifting for
    // photos near midnight depending on where the page is opened.
    // Consecutive photos of one place, kept per day. Runs are the unit both of
    // the steps below work on.
    const dayRuns = new Map();
    files.forEach((file, i) => {
      const day = (file.createdTime || "").slice(0, 10);
      const label = resolvedLabels[i];
      if (!dayRuns.has(day)) dayRuns.set(day, []);
      const runs = dayRuns.get(day);
      const current = runs[runs.length - 1];
      if (current && current.label === label) current.items.push({ file, label });
      else runs.push({ label, items: [{ file, label }] });
    });

    // Absorb one-photo runs into the place around them.
    //
    // Passing a village by boat gets a GPS fix and therefore a heading, for a
    // place never actually visited — a single photo announcing a town of its
    // own, between two stretches of somewhere real. Those single photos join
    // the run before them, and the run after if they open the day.
    //
    // The heading they end up under is then approximate: a photo taken in
    // Sommerberg can sit under Passau. That is the point — it belongs to the
    // Passau stretch of the day — and the photo's own filename, shown on the
    // card, still says where it was actually taken.
    dayRuns.forEach((runs) => {
      for (let i = 0; i < runs.length; i++) {
        if (runs.length < 2 || runs[i].items.length !== 1) continue;
        const backwards = i > 0;
        const target = backwards ? runs[i - 1] : runs[1];
        const moved = runs[i].items.map((x) => ({ file: x.file, label: target.label }));
        // Backwards the photo follows the run it joins; forwards it precedes it.
        if (backwards) target.items.push(...moved);
        else target.items.unshift(...moved);
        runs.splice(i, 1);
        i--; // re-examine this slot, which now holds the following run
      }
    });

    // Collapse repeat visits: one heading per place per day, positioned where
    // that day's first photo of it falls.
    const ordered = [];
    dayRuns.forEach((runs) => {
      const visits = new Map();
      runs.forEach((run) => {
        if (!visits.has(run.label)) visits.set(run.label, []);
        visits.get(run.label).push(...run.items);
      });
      visits.forEach((items) => ordered.push(...items));
    });

    contentEl.className = "";
    contentEl.innerHTML = "";

    let lastCity = null;
    for (let i = 0; i < ordered.length; i++) {
      const file = ordered[i].file;
      const city = ordered[i].label;
      if (city !== lastCity) {
        const header = document.createElement("div");
        header.className = "city-header";
        header.textContent = city;
        contentEl.appendChild(header);
        lastCity = city;
      }

      const card = document.createElement("div");
      card.className = "photo-card";

      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = `https://drive.google.com/thumbnail?id=${file.id}&sz=w1000`;
      img.alt = escapeHtml(file.name);
      card.appendChild(img);

      const linkRow = document.createElement("div");
      linkRow.className = "link-row";
      card.appendChild(linkRow);

      const infoLink = document.createElement("button");
      infoLink.className = "info-link";
      infoLink.type = "button";
      infoLink.textContent = "Info";
      linkRow.appendChild(infoLink);

      // textContent, not innerHTML: the filename comes from Drive and is not ours
      // to trust as markup. The extension is dropped — every photo here is a
      // .jpg, so it is four characters of noise in a space that is already tight.
      const photoName = document.createElement("div");
      photoName.className = "photo-name";
      photoName.textContent = file.name.replace(/\.[^/.]+$/, "");
      photoName.title = file.name; // full name, extension and all, on hover
      linkRow.appendChild(photoName);

      const mapLink = document.createElement("button");
      mapLink.className = "map-link";
      mapLink.type = "button";
      mapLink.textContent = "Map";
      mapLink.disabled = true;
      linkRow.appendChild(mapLink);

      const infoResult = document.createElement("div");
      infoResult.className = "info-result";
      card.appendChild(infoResult);

      // The map iframe is built on first use, not up front. Even with lazy
      // loading an iframe is a whole nested browsing context, and a hundred of
      // them cost enough main-thread work during render that a reply already
      // sitting in memory can't be painted for several seconds.
      let mapEmbed = null;

      infoLink.addEventListener("click", async () => {
        const cached = infoCache.get(file.id);
        if (cached) {
          infoResult.classList.toggle("visible");
          return;
        }
        infoResult.classList.add("visible");

        // The app writes its description onto the Drive file, so most photos
        // already carry one. Showing it is instant, costs no Gemini call, and
        // means every visitor sees the same text rather than each generating
        // their own slightly different version of it.
        const stored = (file.description || "").trim();
        if (stored) {
          infoCache.set(file.id, stored);
          infoResult.textContent = stored;
          return;
        }

        infoResult.textContent = "Loading info…";

        // Photos the app never described fall to whoever opens them first here.
        // The proxy keeps that result, so this is a lookup for everyone after.
        const remembered = await lookupDescription(file);
        if (remembered) {
          infoCache.set(file.id, remembered);
          infoResult.textContent = remembered;
          return;
        }

        const description = await describePhoto(file);
        infoCache.set(file.id, description);
        infoResult.textContent = description;
      });

      let mapCoords = null;
      let mapState = "checking"; // "checking" | "found" | "none" | "error"

      async function refreshMapState() {
        const result = await getGpsForPhoto(file.id);
        if (!result.ok) {
          mapState = "error";
          mapLink.disabled = false;
          mapLink.classList.add("retry");
          mapLink.textContent = "Map ⟳";
          return;
        }
        mapLink.classList.remove("retry");
        if (result.coords) {
          mapCoords = result.coords;
          mapState = "found";
          mapLink.disabled = false;
          mapLink.textContent = "Map";
        } else {
          mapState = "none";
          mapLink.disabled = true;
          mapLink.textContent = "Map";
        }
      }

      mapLink.addEventListener("click", () => {
        // Tapping before the deferred read has run: do it now rather than
        // leave the button looking inert.
        if (mapState === "checking") {
          refreshMapState();
          return;
        }
        if (mapState === "error") {
          mapLink.textContent = "Map ⟳ …";
          mapLink.disabled = true;
          mapLink.classList.remove("retry");
          refreshMapState();
          return;
        }
        if (mapState !== "found" || !mapCoords) return;
        if (!mapEmbed) {
          mapEmbed = document.createElement("iframe");
          mapEmbed.className = "map-embed";
          mapEmbed.loading = "lazy";
          mapEmbed.src = `https://maps.google.com/maps?q=${mapCoords.lat},${mapCoords.lon}&z=15&output=embed`;
          card.appendChild(mapEmbed);
        }
        mapEmbed.classList.toggle("visible");
      });

      contentEl.appendChild(card);
      // Observed only once it's in the document, or there is nothing for the
      // observer to measure against.
      card.whenNear = refreshMapState;
      nearViewport.observe(card);
    }
  }

  loadPhotos();
</script>
</body>
</html>
